[workspace]

members = [
    "algebra",
    "algebra_derive",
    # "fhe_core",
    "lattice",
    # "fhe",
    "fhe_ops",
    "pcs",
    "zkfhe",
    "zkp",
    "sumcheck",
    "trace",
]

resolver = "2"

[workspace.dependencies]
thiserror = "2.0"
num-traits = "0.2"
once_cell = "1.21"
rand = "0.9"
rand_distr = "0.5"
rand_core = "0.9"
rand_chacha = "0.9"
rayon = "1.11"
bytemuck = { version = "1.24", features = ["derive"] }
merlin = { version = "3.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
bincode = { version = "2.0", features = ["serde"] }
itertools = "0.14"

criterion = "0.8"

[profile.bench]
lto = true
codegen-units = 1

[profile.release]
lto = true
codegen-units = 1
